version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing SalsaG CLI for verification..."
      - python3 -m pip install --upgrade pip
      - echo "Installing cosign for cryptographic verification..."
      - curl -O -L "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64"
      - sudo mv cosign-linux-amd64 /usr/local/bin/cosign
      - sudo chmod +x /usr/local/bin/cosign
      - cosign version
      - echo "Cloning SalsaG CLI from GitHub..."
      - git clone https://github.com/tanishk97/MICS295Capstone.git temp-repo
      - cd temp-repo/salsag-cli && pip install -e . && cd ../..
      - echo "SalsaG CLI installed successfully"
  pre_build:
    commands:
      - echo "Starting deployment phase"
      - ls -la
      - echo "🔍 Verifying index.tgz with SalsaG CLI..."
      - |
        # Create salsag.yml config file
        cat > salsag.yml << EOF
        aws:
          region: us-east-1
          staging_bucket: mics295-pipeline-artifacts
          ledger_table: trust-ledger
        EOF
      - |
        if salsaG verify --artifact index.tgz --config salsag.yml; then
          echo "✅ index.tgz verification PASSED - proceeding with deployment"
        else
          echo "❌ index.tgz verification FAILED - stopping deployment"
          exit 1
        fi
  build:
    commands:
      - echo "🔒 Downloading VERIFIED index.tgz for deployment..."
      - aws s3 cp s3://mics295-pipeline-artifacts/index.tgz ./verified-index.tgz
      - echo "📦 Extracting verified content..."
      - tar -xzf verified-index.tgz
      - echo "🚀 Deploying ONLY verified content to S3..."
      - aws s3 cp index.html s3://mics295-capstone-website/index.html
  post_build:
    commands:
      - echo "Deployment completed successfully"
      - 'echo "Website URL: http://mics295-capstone-website.s3-website-us-east-1.amazonaws.com"'
