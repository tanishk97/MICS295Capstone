<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalsaG Security Demo </title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .header { text-align: center; color: #2c3e50; }
        .status { padding: 15px; margin: 20px 0; border-radius: 5px; }
        .verified { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .pending { background: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
        button { background: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔒 SalsaG Security Pipeline</h1>
        <p>Demonstrating artifact signing and verification</p>
    </div>
    
    <div class="status verified">
        ✅ Artifact verified and signed with SalsaG CLI
    </div>
    
    <div class="status pending">
        🔐 Cosign signature verification in progress...
    </div>
    
    <button onclick="window.location.reload()">Refresh Status</button>
    
    <script>
        console.log('SalsaG Demo App loaded');
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page ready - artifact verification complete');
        });
    </script>
</body>
</html>
