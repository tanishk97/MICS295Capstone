name: Verify and Promote Artifact

on:
  workflow_dispatch:
    inputs:
      object_key:
        description: 'Artifact to verify (e.g., site-abc123.tgz)'
        required: true
        type: string
      promote:
        description: 'Promote to production after verification'
        required: false
        default: true
        type: boolean

env:
  STAGING_BUCKET: mics295-pipeline-artifacts
  WEBSITE_BUCKET: mics295-capstone-website
  ROLE_ARN: arn:aws:iam::814074632338:role/GHAOIDCDeployRole
  LEDGER_TABLE: trust-ledger

jobs:
  verify-promote:
    runs-on: codebuild-test3-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Check Central Trust Ledger
        id: ledger_check
        run: |
          OBJECT_URI="s3://${{ env.STAGING_BUCKET }}/${{ inputs.object_key }}"
          echo "🏦 Checking Central Trust Ledger for: $OBJECT_URI"
          
          LEDGER_RESULT=$(aws dynamodb get-item \
            --table-name ${{ env.LEDGER_TABLE }} \
            --key '{"object_key":{"S":"'$OBJECT_URI'"}}' \
            --query 'Item.status.S' \
            --output text)
          
          if [[ "$LEDGER_RESULT" == "verified" ]]; then
            echo "✅ Artifact VERIFIED in Central Trust Ledger"
            
            # Get digest from ledger
            DIGEST=$(aws dynamodb get-item \
              --table-name ${{ env.LEDGER_TABLE }} \
              --key '{"object_key":{"S":"'$OBJECT_URI'"}}' \
              --query 'Item.digest.S' \
              --output text)
            echo "📋 Ledger digest: $DIGEST"
            echo "ledger_digest=$DIGEST" >> $GITHUB_OUTPUT
            echo "verification_status=verified" >> $GITHUB_OUTPUT
          else
            echo "❌ Artifact NOT FOUND or NOT VERIFIED in Central Trust Ledger"
            echo "🚫 Verification FAILED - artifact not in trusted ledger"
            echo "verification_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Promote to production
        if: ${{ inputs.promote && steps.ledger_check.outputs.verification_status == 'verified' }}
        run: |
          BASE="${{ inputs.object_key }}"
          DIGEST="${{ steps.ledger_check.outputs.ledger_digest }}"
          
          echo "🏦 Using digest from Central Trust Ledger: $DIGEST"
          aws s3 cp s3://${{ env.STAGING_BUCKET }}/${BASE} s3://${{ env.WEBSITE_BUCKET }}/ \
            --tagging "trust=verified&digest=${DIGEST#sha256:}"
          echo "✅ Artifact promoted to production with trust=verified tag"

      - name: Verification complete
        run: |
          echo "🏦 Central Trust Ledger Verification for ${{ inputs.object_key }}"
          echo "📋 Digest: ${{ steps.ledger_check.outputs.ledger_digest }}"
          echo "⚡ Single Source of Truth: DynamoDB Ledger"
          
          if [[ "${{ inputs.promote }}" == "true" ]]; then
            echo "🚀 Artifact promoted to production"
          else
            echo "📋 Verification only - no promotion"
          fi
