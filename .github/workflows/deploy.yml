name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: codebuild-test3-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Tests
      run: |
        echo "Running tests..."
        # Add your test commands here
        
    - name: Build Application
      run: |
        echo "Building static website..."
        ls -la
        
    - name: Package Artifacts
      run: |
        zip -r website.zip . -x "*.git*" "*.github*" "*.DS_Store*" "pipeline.yml" "*.md" "*.sh"
        
    - name: Upload to Pipeline Artifacts
      run: |
        aws s3 cp website.zip s3://mics295-capstone-website/artifacts/website.zip
        
    - name: Trigger CodePipeline
      run: |
        aws codepipeline start-pipeline-execution --name mics295-pipeline
