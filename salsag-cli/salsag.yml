# SalsaG Trust Pipeline Configuration
aws:
  region: us-east-1
  staging_bucket: test
  ledger_table: trust-ledger

signing:
  oidc_issuer: "https://token.actions.githubusercontent.com"
  identity_regexp: "https://github.com/.+"

artifacts:
  compression: "gzip"
  include_sbom: true
  include_provenance: true

logging:
  cloudwatch:
    level: "INFO"
    log_group: "salsagate"
    stream_name: "Stream2"
  syslog:
    level: "INFO"
    address: "/dev/log"
             
        
